<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/*@@CSS@@*/

<div id="app">
  <header id="top">
    <div class="ribbon" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="decree" id="decree"></div>
    <div class="topbar">
      <div class="agebar"><span class="cockade" aria-hidden="true"></span><b id="age">0</b><span class="sfx">세</span><span id="subline"></span></div>
      <div class="ctl">
        <button class="cb" id="pp" type="button" aria-label="일시정지"></button>
        <div class="spd" id="spd"><button type="button" data-s="1">1×</button><button type="button" data-s="2">2×</button><button type="button" data-s="4">4×</button><button type="button" data-s="8">8×</button><button type="button" data-s="12">12×</button><button type="button" data-s="16">16×</button></div>
        <button class="cb" id="nextB" type="button">다음 »</button>
        <button class="cb" id="moreB" type="button" aria-label="메뉴">⋯</button>
        <div class="menu" id="menu" hidden>
          <button type="button" id="mInfo">세부 정보</button>
          <button type="button" id="mPol">정치</button>
          <button type="button" id="mHist">이력</button>
          <button type="button" id="mHelp">설명</button>
          <button type="button" id="mLives">지난 인생</button>
          <button type="button" id="mSrc">참고 문헌</button>
          <button type="button" id="autoT" aria-pressed="false">자동 선택 꺼짐</button>
          <button type="button" id="mNew">처음 화면</button>
        </div>
      </div>
    </div>
    <div class="prog"><i id="progFill"></i></div>
    <div class="hint" id="hint" hidden>빠르게 보려면 4×나 8×를 눌러 보세요. 중요한 결정이 오면 시간이 멈춰요.</div>
  </header>
  <main class="board">
    <div class="colL">
      <section class="card prof" id="profCard"></section>
      <section class="card polc" id="polCard"></section>
      <section class="card relc" id="relCard"></section>
    </div>
    <div class="colR">
      <section class="card scene">
        <canvas id="cv" width="256" height="96" aria-label="지금 사는 곳과 가족"></canvas>
        <div class="sc-t"><div class="where" id="where"></div><div class="mut" id="famAges"></div><div class="era mut" id="era"></div></div>
        <div class="econ" id="econCard"></div>
      </section>
      <section class="card logc">
        <div class="ch"><h2>인생 기록</h2><span class="mut">최근 순 <button class="lnk" id="dataT" type="button" aria-pressed="false">자료 보기</button></span></div>
        <div id="log" aria-live="polite"></div>
        <div class="logmore"><button class="pill" id="logMore" type="button" hidden></button><button class="pill" id="logLess" type="button" hidden>접기</button></div>
      </section>
    </div>
  </main>
  <div id="sheet" hidden><div class="sh" role="dialog" aria-modal="true" aria-labelledby="shT"><div class="shdecree" id="shDecree"></div><div class="shh"><h2 id="shT"></h2><span class="mut" id="shFr"></span></div><div id="shB"></div></div></div>
  <div class="toast" id="toast" role="status" hidden></div>
</div>

<div id="panel" class="over" hidden><div class="pw"><div class="ph"><h2 id="pT"></h2><button class="cb" id="pClose" type="button">닫기</button></div><div id="pin"></div></div></div>

<div id="title" class="over splash">
  <div class="ribbon" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="sp">
    <div class="sp-cockade" aria-hidden="true"></div>
    <div class="sp-year">17<span>89</span></div>
    <h1 class="sp-t">한 시민의 일생</h1>
    <p class="sp-f">Vie d’un citoyen de Paris</p>
    <div class="sp-btns">
      <button class="pill pri" id="newB" type="button">새 게임</button>
      <button class="pill" id="contB" type="button" hidden>이어가기</button>
    </div>
  </div>
  <p class="sp-motto">Liberté · Égalité · Fraternité</p>
</div>

<div id="end" class="over splash" hidden>
  <div class="ribbon dark" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="sp">
    <div class="ob-k">부고 · Nécrologie</div>
    <div class="ob-n" id="obName"></div>
    <div class="ob-y" id="obYears"></div>
    <p class="ob-w" id="obWill"></p>
    <div class="sp-btns">
      <button class="pill pri" id="againB" type="button">새 게임</button>
      <button class="pill" id="homeB" type="button">처음으로</button>
    </div>
  </div>
</div>
