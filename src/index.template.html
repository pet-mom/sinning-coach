<title>1789 한 시민의 일생</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2215%22 fill=%22%23A3262C%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2210%22 fill=%22%23fff%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%225%22 fill=%22%2327407A%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Pinyon+Script&family=UnifrakturMaguntia&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=IM+Fell+English:ital@0;1&family=Noto+Serif+KR:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
/*@@CSS@@*/
</style>
<div id="app">
  <header id="top">
    <div class="ribbon" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="decree" id="decree"></div>
    <div class="topbar">
      <div class="agebar"><span class="cockade" aria-hidden="true"></span><b id="age">0</b><span class="sfx">세</span><span id="subline"></span></div>
      <div class="ctl">
        <button class="cb" id="pp" type="button" aria-label="일시정지"></button>
        <div class="spd" id="spd"><button type="button" data-s="1">1×</button><button type="button" data-s="2">2×</button><button type="button" data-s="4">4×</button><button type="button" data-s="8">8×</button><button type="button" data-s="12">12×</button><button type="button" data-s="16">16×</button></div>
        <button class="cb" id="nextB" type="button">다음 »</button>
        <button class="cb" id="moreB" type="button" aria-label="메뉴">⋯</button>
        <div class="menu" id="menu" hidden>
          <button type="button" id="mInfo">세부 정보</button>
          <button type="button" id="mPol">정치</button>
          <button type="button" id="mHist">이력</button>
          <button type="button" id="mHelp">설명</button>
          <button type="button" id="mLives">지난 인생</button>
          <button type="button" id="mSrc">참고 문헌</button>
          <button type="button" id="mImg">그림 출처</button>
          <button type="button" id="autoT" aria-pressed="false">자동 선택 꺼짐</button>
          <button type="button" id="mNew">처음 화면</button>
        </div>
      </div>
    </div>
    <div class="prog"><i id="progFill"></i></div>
    <div class="hint" id="hint" hidden>빠르게 보려면 4×나 8×를 눌러 보세요. 중요한 결정이 오면 시간이 멈춰요.</div>
  </header>
  <main class="tabs">
    <section class="tab" id="tProfile" data-t="profile" hidden>
      <div class="card prof" id="profCard"></div>
      <div id="profMore"></div>
    </section>
    <section class="tab" id="tRel" data-t="rel" hidden>
      <div class="card relc" id="relCard"></div>
      <div id="relMore"></div>
    </section>
    <section class="tab" id="tDaily" data-t="daily">
      <div class="hero scene">
        <canvas id="cv" width="256" height="96" aria-label="지금 사는 곳과 가족"></canvas>
        <div class="hero-date" id="heroDate"></div>
        <div class="sc-t" hidden><div class="where" id="where"></div><div class="mut" id="famAges"></div><div class="era mut" id="era"></div></div>
      </div>
      <div class="card home" id="homeCard"></div>
      <div class="card sched" id="schedCard"></div>
      <div class="econ" id="econCard"></div>
      <div class="card logc">
        <div class="ch"><h2>인생 기록</h2><span class="mut">최근 순 <button class="lnk" id="dataT" type="button" aria-pressed="false">자료 보기</button></span></div>
        <div id="log" aria-live="polite"></div>
        <div class="logmore"><button class="pill" id="logMore" type="button" hidden></button><button class="pill" id="logLess" type="button" hidden>접기</button></div>
      </div>
    </section>
    <section class="tab" id="tLife" data-t="life" hidden><div id="lifeHost"></div></section>
    <section class="tab" id="tEra" data-t="era" hidden>
      <div class="card polc" id="polCard"></div>
      <div id="eraHost"></div>
    </section>
  </main>
  <nav class="nav" id="nav" aria-label="화면">
    <button type="button" data-t="profile"><svg class="ni" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>프로필</button>
    <button type="button" data-t="rel"><svg class="ni" viewBox="0 0 24 24" aria-hidden="true"><circle cx="8.5" cy="8.5" r="3.2"/><circle cx="16.5" cy="9.5" r="2.7"/><path d="M2.5 20c0-3.6 2.7-6 6-6s6 2.4 6 6M14 14.4c3.6-.6 7.5 1.4 7.5 5.6"/></svg>관계</button>
    <button type="button" data-t="daily" aria-current="page"><svg class="ni" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 4l8.5 6.5V20a1 1 0 0 1-1 1h-5v-6h-5v6h-5a1 1 0 0 1-1-1z"/></svg>일상</button>
    <button type="button" data-t="life"><svg class="ni" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="7.5" width="17" height="12.5" rx="2"/><path d="M9 7.5V5.5a1.5 1.5 0 0 1 1.5-1.5h3A1.5 1.5 0 0 1 15 5.5v2M3.5 12.5h17"/></svg>생활</button>
    <button type="button" data-t="era"><svg class="ni" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4M5 4h11l-2 3.5 2 3.5H5"/></svg>시대</button>
  </nav>
  <div id="sheet" hidden><div class="sh" role="dialog" aria-modal="true" aria-labelledby="shT"><div class="sh-top"><span class="sh-k">사건</span><span class="shdecree" id="shDecree"></span></div><div class="shh"><h2 id="shT"></h2><span class="mut" id="shFr"></span></div><canvas id="shArt" width="256" height="96" aria-hidden="true"></canvas><div id="shB"></div></div></div>
  <div class="toast" id="toast" role="status" hidden></div>
</div>

<div id="panel" class="over" hidden><div class="pw"><div class="ph"><h2 id="pT"></h2><button class="cb" id="pClose" type="button">닫기</button></div><div id="pin"></div></div></div>

<div id="title" class="over splash">
  <div class="t-bg" aria-hidden="true"><canvas id="titleArt" width="256" height="96"></canvas></div>
  <div class="sp">
    <div class="t-head">
      <div class="mono" aria-hidden="true">C<i>&amp;</i>P</div>
      <p class="scr">Bienvenue à</p>
      <div class="sp-year">MDCCLXXXIX</div>
      <p class="scr big">une vie française</p>
      <h1 class="sp-t">한 시민의 일생</h1>
      <svg class="laurel" viewBox="0 0 320 300" aria-hidden="true" id="laurel" hidden></svg>
    </div>
    <div class="card newf" id="newForm">
      <div class="nf-row">
        <input id="inGiven" maxlength="12" autocomplete="off" placeholder="이름" aria-label="이름">
        <input id="inSur" maxlength="16" autocomplete="off" placeholder="성" aria-label="성">
        <button class="cb dice" id="rollB" type="button" aria-label="무작위로 정하기" title="이름·신분·출생일을 무작위로">⚄</button>
      </div>
      <div class="nf-est"><span id="estName"></span><span class="mut" id="estFr"></span></div>
      <div class="nf-sex" role="group" aria-label="성별"><button type="button" class="fopt" data-x="M">남</button><button type="button" class="fopt" data-x="F">여</button></div>
      <div class="nf-date"><label>출생일</label><select id="bY" aria-label="출생 연도"></select><select id="bM" aria-label="출생 월"></select><select id="bD" aria-label="출생 일"></select></div>
      <p class="mut small nf-place">출생지 · 파리</p>
      <button class="pill pri" id="goB" type="button">게임 시작</button>
    </div>
    <div class="sp-btns"><button class="pill" id="contB" type="button" hidden>이어가기</button></div>
  </div>
  <p class="sp-motto">Liberté · Égalité · Fraternité</p>
</div>

<div id="end" class="over splash" hidden>
  <div class="ribbon dark" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="sp wide">
    <div class="ob-k">부고 · Nécrologie</div>
    <div class="ob-n" id="obName"></div>
    <div class="ob-y" id="obYears"></div>
    <p class="ob-w" id="obWill"></p>
    <div class="ob-sec"><h3>남은 사람들</h3><ul class="ob-rels" id="obRels"></ul></div>
    <div class="ob-sec"><h3>사후 평가</h3><div id="obEval"></div></div>
    <div class="sp-btns">
      <button class="pill pri" id="againB" type="button">새 게임</button>
      <button class="pill" id="homeB" type="button">처음으로</button>
    </div>
  </div>
</div>
