<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>Web Karaoke — Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #0b0d17;
    --panel: #151828;
    --accent: #ff4d8d;
    --accent2: #5cc8ff;
    --good: #4ade80;
    --bad: #f87171;
    --text: #e6e8f0;
    --muted: #8a90a8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
    background: radial-gradient(ellipse at top, #1a1f3a 0%, var(--bg) 60%);
    color: var(--text);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  header {
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #1f2440;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  header .subtitle { color: var(--muted); font-size: 13px; }

  main {
    flex: 1;
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 16px;
    padding: 16px 24px;
  }

  .library {
    background: var(--panel);
    border-radius: 12px;
    padding: 16px;
    overflow-y: auto;
  }
  .library h2 { font-size: 14px; color: var(--muted); margin: 0 0 12px; text-transform: uppercase; letter-spacing: 0.5px; }
  .song-item {
    padding: 12px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 8px;
    background: #1a1f35;
    transition: background 0.15s;
  }
  .song-item:hover { background: #232845; }
  .song-item.active { background: linear-gradient(135deg, var(--accent) 0%, #c038ff 100%); }
  .song-item .title { font-weight: 600; font-size: 14px; }
  .song-item .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .song-item.active .meta { color: rgba(255,255,255,0.85); }

  .stage {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .lyrics-panel {
    background: var(--panel);
    border-radius: 12px;
    padding: 32px 24px;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 280px;
    text-align: center;
  }
  .lyric-line {
    font-size: 22px;
    color: var(--muted);
    margin: 8px 0;
    transition: all 0.25s;
  }
  .lyric-line.current {
    font-size: 36px;
    color: var(--text);
    font-weight: 700;
    background: linear-gradient(90deg, var(--accent) 0%, var(--accent2) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .lyric-line.next { font-size: 20px; color: var(--muted); }

  .pitch-panel {
    background: var(--panel);
    border-radius: 12px;
    padding: 16px;
    height: 200px;
    position: relative;
  }
  #pitchCanvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  .scorebar {
    background: var(--panel);
    border-radius: 12px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .score-label { font-size: 12px; color: var(--muted); }
  .score-value { font-size: 28px; font-weight: 700; }
  .score-bar { flex: 1; height: 8px; background: #1a1f35; border-radius: 4px; overflow: hidden; }
  .score-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent) 0%, var(--accent2) 100%);
    width: 0%;
    transition: width 0.2s;
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: var(--panel);
    border-radius: 12px;
  }
  button {
    background: linear-gradient(135deg, var(--accent) 0%, #c038ff 100%);
    border: none;
    color: white;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s;
  }
  button:hover { transform: translateY(-1px); }
  button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  button.secondary {
    background: #232845;
    color: var(--text);
  }
  button.recording {
    background: var(--bad);
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
  }
  .time { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .progress { flex: 1; height: 6px; background: #1a1f35; border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent2); width: 0%; }
  .recordings {
    background: var(--panel);
    border-radius: 12px;
    padding: 12px 16px;
  }
  .recordings h3 { margin: 0 0 8px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .recording-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px;
    background: #1a1f35;
    border-radius: 6px;
    margin-bottom: 6px;
    font-size: 13px;
  }
  audio { flex: 1; height: 32px; }
</style>
</head>
<body>

<header>
  <div>
    <h1>🎤 Web Karaoke</h1>
    <div class="subtitle">원곡 재생 · 실시간 가사 · 음정 채점 · 녹음</div>
  </div>
  <div class="time" id="header-status">대기 중</div>
</header>

<main>
  <aside class="library">
    <h2>라이브러리 (퍼블릭 도메인)</h2>
    <div id="songList"></div>
    <h2 style="margin-top:20px">파일 추가</h2>
    <div style="font-size:12px;color:var(--muted);margin-bottom:8px">MP3 + LRC 업로드</div>
    <input type="file" id="audioFile" accept="audio/*" style="font-size:11px;color:var(--muted);width:100%;margin-bottom:6px" />
    <input type="file" id="lrcFile" accept=".lrc,.txt" style="font-size:11px;color:var(--muted);width:100%" />
  </aside>

  <section class="stage">
    <div class="lyrics-panel" id="lyrics">
      <div class="lyric-line">왼쪽에서 곡을 선택하세요</div>
    </div>

    <div class="pitch-panel">
      <canvas id="pitchCanvas"></canvas>
    </div>

    <div class="scorebar">
      <div>
        <div class="score-label">정확도</div>
        <div class="score-value" id="scoreValue">0</div>
      </div>
      <div class="score-bar"><div class="score-bar-fill" id="scoreBar"></div></div>
      <div>
        <div class="score-label">현재 음정</div>
        <div class="score-value" id="currentNote" style="font-size:20px;color:var(--accent2)">--</div>
      </div>
    </div>

    <div class="controls">
      <button id="playBtn" disabled>▶ 재생</button>
      <button id="recordBtn" class="secondary" disabled>● 녹음</button>
      <span class="time" id="currentTime">0:00</span>
      <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
      <span class="time" id="totalTime">0:00</span>
    </div>

    <div class="recordings">
      <h3>내 녹음</h3>
      <div id="recordingList"><div style="color:var(--muted);font-size:12px">아직 녹음이 없습니다</div></div>
    </div>
  </section>
</main>

<script>
/* =====================================================================
   Web Karaoke — Single-file Prototype
   ---------------------------------------------------------------------
   포함 기능:
   - Web Audio API로 합성된 멜로디 (퍼블릭 도메인 곡)
   - LRC 형식 가사 싱크 (현재 줄 강조)
   - 마이크 입력에서 실시간 피치 감지 (autocorrelation)
   - 목표 음정 vs 사용자 음정 비교 → 점수
   - MediaRecorder API로 녹음 + 재생
   ===================================================================== */

// ---------- 1. 곡 라이브러리 (퍼블릭 도메인) ----------
// 각 곡은 합성용 노트 시퀀스 + LRC 가사로 구성
const NOTES = { C4:261.63, D4:293.66, E4:329.63, F4:349.23, G4:392.00, A4:440.00, B4:493.88, C5:523.25 };

const LIBRARY = [
  {
    id: 'twinkle',
    title: '반짝반짝 작은별',
    artist: 'Traditional (PD)',
    bpm: 100,
    melody: [
      // [note, beats]
      ['C4',1],['C4',1],['G4',1],['G4',1],['A4',1],['A4',1],['G4',2],
      ['F4',1],['F4',1],['E4',1],['E4',1],['D4',1],['D4',1],['C4',2],
      ['G4',1],['G4',1],['F4',1],['F4',1],['E4',1],['E4',1],['D4',2],
      ['G4',1],['G4',1],['F4',1],['F4',1],['E4',1],['E4',1],['D4',2],
      ['C4',1],['C4',1],['G4',1],['G4',1],['A4',1],['A4',1],['G4',2],
      ['F4',1],['F4',1],['E4',1],['E4',1],['D4',1],['D4',1],['C4',2],
    ],
    lrc: `[00:00.00]반짝 반짝 작은별
[00:04.80]아름답게 비치네
[00:09.60]동쪽 하늘에서도
[00:14.40]서쪽 하늘에서도
[00:19.20]반짝 반짝 작은별
[00:24.00]아름답게 비치네`
  },
  {
    id: 'odetojoy',
    title: '환희의 송가 (Ode to Joy)',
    artist: 'Beethoven (PD)',
    bpm: 120,
    melody: [
      ['E4',1],['E4',1],['F4',1],['G4',1],['G4',1],['F4',1],['E4',1],['D4',1],
      ['C4',1],['C4',1],['D4',1],['E4',1],['E4',1.5],['D4',0.5],['D4',2],
      ['E4',1],['E4',1],['F4',1],['G4',1],['G4',1],['F4',1],['E4',1],['D4',1],
      ['C4',1],['C4',1],['D4',1],['E4',1],['D4',1.5],['C4',0.5],['C4',2],
    ],
    lrc: `[00:00.00]기쁨의 노래 부르자
[00:04.00]즐거운 마음 모아서
[00:08.00]모두 함께 손을 잡고
[00:12.00]희망의 길을 걷자`
  },
  {
    id: 'happybirthday',
    title: 'Happy Birthday (멜로디)',
    artist: 'Traditional (PD melody)',
    bpm: 110,
    melody: [
      ['C4',0.75],['C4',0.25],['D4',1],['C4',1],['F4',1],['E4',2],
      ['C4',0.75],['C4',0.25],['D4',1],['C4',1],['G4',1],['F4',2],
      ['C4',0.75],['C4',0.25],['C5',1],['A4',1],['F4',1],['E4',1],['D4',2],
    ],
    lrc: `[00:00.00]생일 축하 합니다
[00:04.00]생일 축하 합니다
[00:08.00]사랑하는 우리님
[00:12.00]생일 축하 합니다`
  }
];

// ---------- 2. LRC 파서 ----------
function parseLRC(text) {
  const lines = [];
  text.split(/\r?\n/).forEach(line => {
    const m = line.match(/\[(\d+):(\d+(?:\.\d+)?)\](.*)/);
    if (m) {
      const t = parseInt(m[1]) * 60 + parseFloat(m[2]);
      lines.push({ time: t, text: m[3].trim() });
    }
  });
  return lines.sort((a, b) => a.time - b.time);
}

// ---------- 3. 합성 멜로디 재생 (Web Audio API) ----------
class MelodyPlayer {
  constructor() {
    this.ctx = null;
    this.gain = null;
    this.startTime = 0;
    this.events = [];      // {time, freq, duration}
    this.totalDuration = 0;
    this.scheduled = [];
    this.playing = false;
  }
  load(song) {
    this.events = [];
    const beatDur = 60 / song.bpm;
    let t = 0;
    for (const [note, beats] of song.melody) {
      const dur = beats * beatDur;
      this.events.push({ time: t, freq: NOTES[note], duration: dur, note });
      t += dur;
    }
    this.totalDuration = t;
  }
  async play(onTick, onEnd) {
    if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (this.ctx.state === 'suspended') await this.ctx.resume();
    this.gain = this.ctx.createGain();
    this.gain.gain.value = 0.25;
    this.gain.connect(this.ctx.destination);
    this.startTime = this.ctx.currentTime;
    this.playing = true;
    this.scheduled = [];

    // 각 노트를 오실레이터로 스케줄
    for (const ev of this.events) {
      const osc = this.ctx.createOscillator();
      const env = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = ev.freq;
      env.gain.value = 0;
      env.gain.setValueAtTime(0, this.startTime + ev.time);
      env.gain.linearRampToValueAtTime(0.6, this.startTime + ev.time + 0.02);
      env.gain.exponentialRampToValueAtTime(0.001, this.startTime + ev.time + ev.duration * 0.95);
      osc.connect(env).connect(this.gain);
      osc.start(this.startTime + ev.time);
      osc.stop(this.startTime + ev.time + ev.duration);
      this.scheduled.push(osc);
    }
    // 진행 상황 콜백
    const tick = () => {
      if (!this.playing) return;
      const now = this.ctx.currentTime - this.startTime;
      onTick(now);
      if (now >= this.totalDuration) {
        this.stop();
        onEnd && onEnd();
        return;
      }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
  stop() {
    this.playing = false;
    this.scheduled.forEach(o => { try { o.stop(); } catch(e){} });
    this.scheduled = [];
  }
  // 현재 시점의 목표 주파수 (피치 채점용)
  targetFreqAt(t) {
    for (const ev of this.events) {
      if (t >= ev.time && t < ev.time + ev.duration) return ev.freq;
    }
    return null;
  }
}

// ---------- 4. 피치 감지 (autocorrelation, ACF2+) ----------
// 출처: 공개된 표준 알고리즘 — 마이크 입력에서 기본 주파수(F0) 추정
function autoCorrelate(buf, sampleRate) {
  const SIZE = buf.length;
  let rms = 0;
  for (let i = 0; i < SIZE; i++) rms += buf[i] * buf[i];
  rms = Math.sqrt(rms / SIZE);
  if (rms < 0.01) return -1;       // 너무 조용함

  let r1 = 0, r2 = SIZE - 1, thres = 0.2;
  for (let i = 0; i < SIZE / 2; i++) if (Math.abs(buf[i]) < thres) { r1 = i; break; }
  for (let i = 1; i < SIZE / 2; i++) if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; }
  buf = buf.slice(r1, r2);
  const NEWSIZE = buf.length;

  const c = new Array(NEWSIZE).fill(0);
  for (let i = 0; i < NEWSIZE; i++)
    for (let j = 0; j < NEWSIZE - i; j++) c[i] = c[i] + buf[j] * buf[j + i];

  let d = 0; while (c[d] > c[d + 1]) d++;
  let maxval = -1, maxpos = -1;
  for (let i = d; i < NEWSIZE; i++) {
    if (c[i] > maxval) { maxval = c[i]; maxpos = i; }
  }
  let T0 = maxpos;
  const x1 = c[T0 - 1] || 0, x2 = c[T0] || 0, x3 = c[T0 + 1] || 0;
  const a = (x1 + x3 - 2 * x2) / 2, b = (x3 - x1) / 2;
  if (a) T0 = T0 - b / (2 * a);
  return sampleRate / T0;
}

function freqToNoteName(f) {
  if (f <= 0) return '--';
  const A4 = 440, names = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const n = Math.round(12 * Math.log2(f / A4));
  const note = names[(n + 9 + 1200) % 12];
  const octave = 4 + Math.floor((n + 9) / 12);
  return `${note}${octave}`;
}

// 두 주파수의 cents 차이 → 정확도 점수 (0~100)
function pitchScore(target, actual) {
  if (!target || actual <= 0) return 0;
  const cents = Math.abs(1200 * Math.log2(actual / target));
  // 50센트 이내면 100점, 그 이상은 빠르게 감점
  if (cents < 50) return 100 - cents;
  if (cents < 200) return Math.max(0, 50 - (cents - 50) * 0.3);
  // 옥타브 차이 보정 (옥타브 위/아래는 대체로 정답으로 인정)
  const wrappedCents = ((cents % 1200) + 1200) % 1200;
  const folded = Math.min(wrappedCents, 1200 - wrappedCents);
  if (folded < 50) return 80 - folded;
  return 0;
}

// ---------- 5. UI 컨트롤러 ----------
const player = new MelodyPlayer();
let currentSong = null;
let lrc = [];
let micStream = null;
let micCtx = null;
let micAnalyser = null;
let micBuf = null;
let pitchTimer = null;
let recorder = null;
let recordChunks = [];
let scoreSamples = [];

const $ = id => document.getElementById(id);

// 라이브러리 렌더
function renderLibrary() {
  const list = $('songList');
  list.innerHTML = '';
  LIBRARY.forEach(song => {
    const div = document.createElement('div');
    div.className = 'song-item';
    div.innerHTML = `<div class="title">${song.title}</div><div class="meta">${song.artist}</div>`;
    div.onclick = () => selectSong(song);
    list.appendChild(div);
  });
}

function selectSong(song) {
  currentSong = song;
  player.load(song);
  lrc = parseLRC(song.lrc);
  $('playBtn').disabled = false;
  $('recordBtn').disabled = false;
  document.querySelectorAll('.song-item').forEach((el, i) => {
    el.classList.toggle('active', LIBRARY[i].id === song.id);
  });
  $('totalTime').textContent = formatTime(player.totalDuration);
  $('currentTime').textContent = '0:00';
  $('progressFill').style.width = '0%';
  renderLyrics(0);
  $('header-status').textContent = `선택됨: ${song.title}`;
}

function formatTime(s) {
  const m = Math.floor(s / 60), sec = Math.floor(s % 60);
  return `${m}:${sec.toString().padStart(2, '0')}`;
}

function renderLyrics(t) {
  if (!lrc.length) return;
  let idx = -1;
  for (let i = 0; i < lrc.length; i++) if (t >= lrc[i].time) idx = i;
  const prev = idx > 0 ? lrc[idx - 1].text : '';
  const cur = idx >= 0 ? lrc[idx].text : '잠시 후 시작합니다...';
  const next = idx + 1 < lrc.length ? lrc[idx + 1].text : '';
  $('lyrics').innerHTML = `
    ${prev ? `<div class="lyric-line">${prev}</div>` : ''}
    <div class="lyric-line current">${cur}</div>
    ${next ? `<div class="lyric-line next">${next}</div>` : ''}
  `;
}

// ---------- 마이크 + 피치 루프 ----------
async function startMic() {
  if (micStream) return;
  micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false } });
  micCtx = new (window.AudioContext || window.webkitAudioContext)();
  const src = micCtx.createMediaStreamSource(micStream);
  micAnalyser = micCtx.createAnalyser();
  micAnalyser.fftSize = 2048;
  src.connect(micAnalyser);
  micBuf = new Float32Array(micAnalyser.fftSize);
}

function stopMic() {
  if (pitchTimer) cancelAnimationFrame(pitchTimer);
  pitchTimer = null;
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  micStream = null;
  micCtx = null;
}

// 피치 시각화용 캔버스 히스토리
const pitchHistory = [];
const HIST_LEN = 200;

function drawPitch(currentT) {
  const cv = $('pitchCanvas');
  const dpr = window.devicePixelRatio || 1;
  cv.width = cv.clientWidth * dpr;
  cv.height = cv.clientHeight * dpr;
  const ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);
  const W = cv.clientWidth, H = cv.clientHeight;
  ctx.clearRect(0, 0, W, H);

  // 격자
  ctx.strokeStyle = '#1f2440';
  ctx.lineWidth = 1;
  for (let i = 1; i < 5; i++) {
    ctx.beginPath();
    ctx.moveTo(0, (H / 5) * i);
    ctx.lineTo(W, (H / 5) * i);
    ctx.stroke();
  }

  // 주파수 → y 좌표 (대략 C3~C5 매핑, log scale)
  const fMin = 130, fMax = 600;
  const f2y = f => H - ((Math.log2(f / fMin)) / Math.log2(fMax / fMin)) * H;

  // 목표 라인
  if (player.playing) {
    ctx.strokeStyle = '#5cc8ff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    let started = false;
    const totalT = player.totalDuration || 1;
    for (const ev of player.events) {
      const x1 = (ev.time / totalT) * W;
      const x2 = ((ev.time + ev.duration) / totalT) * W;
      const y = f2y(ev.freq);
      if (!started) { ctx.moveTo(x1, y); started = true; }
      ctx.lineTo(x1, y);
      ctx.lineTo(x2, y);
    }
    ctx.stroke();
    // 진행 표시선
    const px = (currentT / totalT) * W;
    ctx.strokeStyle = 'rgba(255,77,141,0.4)';
    ctx.beginPath();
    ctx.moveTo(px, 0); ctx.lineTo(px, H); ctx.stroke();
  }

  // 사용자 피치 히스토리
  ctx.fillStyle = '#ff4d8d';
  pitchHistory.forEach((p, i) => {
    if (p.freq <= 0) return;
    const x = (p.t / (player.totalDuration || 1)) * W;
    const y = f2y(p.freq);
    ctx.beginPath();
    ctx.arc(x, y, 3, 0, Math.PI * 2);
    ctx.fill();
  });
}

function pitchLoop() {
  if (!micAnalyser) return;
  micAnalyser.getFloatTimeDomainData(micBuf);
  const f = autoCorrelate(micBuf, micCtx.sampleRate);
  const t = player.playing ? (player.ctx.currentTime - player.startTime) : 0;

  if (player.playing) {
    pitchHistory.push({ t, freq: f });
    if (pitchHistory.length > HIST_LEN * 2) pitchHistory.shift();

    const target = player.targetFreqAt(t);
    const sc = pitchScore(target, f);
    scoreSamples.push(sc);
    const avg = scoreSamples.reduce((a, b) => a + b, 0) / scoreSamples.length;
    $('scoreValue').textContent = Math.round(avg);
    $('scoreBar').style.width = `${avg}%`;
  }
  $('currentNote').textContent = freqToNoteName(f);
  drawPitch(player.playing ? (player.ctx.currentTime - player.startTime) : 0);
  pitchTimer = requestAnimationFrame(pitchLoop);
}

// ---------- 녹음 ----------
async function toggleRecord() {
  const btn = $('recordBtn');
  if (recorder && recorder.state === 'recording') {
    recorder.stop();
    btn.textContent = '● 녹음';
    btn.classList.remove('recording');
    return;
  }
  if (!micStream) await startMic();
  recordChunks = [];
  recorder = new MediaRecorder(micStream);
  recorder.ondataavailable = e => recordChunks.push(e.data);
  recorder.onstop = () => {
    const blob = new Blob(recordChunks, { type: 'audio/webm' });
    const url = URL.createObjectURL(blob);
    const list = $('recordingList');
    if (list.firstChild && list.firstChild.tagName !== 'DIV' || list.children.length === 1 && list.children[0].style) list.innerHTML = '';
    const item = document.createElement('div');
    item.className = 'recording-item';
    item.innerHTML = `
      <span style="color:var(--muted)">${currentSong ? currentSong.title : '녹음'} · ${new Date().toLocaleTimeString()}</span>
      <audio controls src="${url}"></audio>
      <a href="${url}" download="karaoke-${Date.now()}.webm" style="color:var(--accent2);text-decoration:none;font-size:12px">⇩</a>
    `;
    list.prepend(item);
  };
  recorder.start();
  btn.textContent = '■ 정지';
  btn.classList.add('recording');
}

// ---------- 재생 시작 ----------
async function togglePlay() {
  if (!currentSong) return;
  const btn = $('playBtn');
  if (player.playing) {
    player.stop();
    btn.textContent = '▶ 재생';
    return;
  }
  await startMic();
  scoreSamples = [];
  pitchHistory.length = 0;
  if (!pitchTimer) pitchLoop();

  btn.textContent = '■ 정지';
  await player.play(
    (t) => {
      $('currentTime').textContent = formatTime(t);
      $('progressFill').style.width = `${(t / player.totalDuration) * 100}%`;
      renderLyrics(t);
    },
    () => {
      btn.textContent = '▶ 재생';
      $('header-status').textContent = `완료 · 최종 점수 ${$('scoreValue').textContent}`;
    }
  );
}

// ---------- 사용자 파일 업로드 ----------
let uploadedAudio = null;
let uploadedLrc = null;

$('audioFile').addEventListener('change', async e => {
  const f = e.target.files[0];
  if (!f) return;
  uploadedAudio = URL.createObjectURL(f);
  alert(`오디오 로드됨: ${f.name}\n(현재 프로토타입은 합성 멜로디 기반입니다. MP3 채점은 보컬 분리 백엔드 연동이 필요합니다 — README 참고)`);
});
$('lrcFile').addEventListener('change', async e => {
  const f = e.target.files[0];
  if (!f) return;
  uploadedLrc = await f.text();
  alert(`가사 ${parseLRC(uploadedLrc).length}줄 로드됨`);
});

// 이벤트 바인딩
$('playBtn').addEventListener('click', togglePlay);
$('recordBtn').addEventListener('click', toggleRecord);

// 초기화
renderLibrary();
selectSong(LIBRARY[0]);
</script>
